services:
  postgres:
    image: postgres:17-alpine
    container_name: modelbenin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelbenin}
      POSTGRES_USER: ${POSTGRES_USER:-modelbenin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelbenin}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modelbenin-redis
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
